<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>STREET BRAWL — Waffen-Kampf</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<div id="app">

  <!-- ============ TITEL ============ -->
  <section id="screen-title" class="screen active">
    <div class="title-bg"></div>
    <div class="title-content">
      <div class="title-eyebrow">UNDERGROUND</div>
      <h1 class="title-logo">STREET<br><span>BRAWL</span></h1>
      <div class="title-sub">NO RULES · NO MERCY</div>
      <button id="btn-start" class="btn-red">KÄMPFEN</button>
    </div>
  </section>

  <!-- ============ FIGHTER SELECT ============ -->
  <section id="screen-select" class="screen">
    <div class="sel-header">
      <span class="sel-title">KÄMPFER WÄHLEN</span>
    </div>
    <div class="sel-body">
      <!-- Spieler -->
      <div class="sel-side" id="side-player">
        <div class="side-tag player-tag">DU</div>
        <div class="roster" id="roster-player"></div>
        <div class="weapon-row" id="weapons-player"></div>
      </div>

      <!-- VS Vorschau -->
      <div class="sel-preview">
        <canvas id="preview-canvas" width="400" height="380"></canvas>
        <div class="vs-text">VS</div>
        <div class="preview-names">
          <span id="prev-pname" class="pname-red">—</span>
          <span id="prev-aname" class="pname-gold">—</span>
        </div>
        <button id="btn-fight" class="btn-red btn-fight">FIGHT!</button>
      </div>

      <!-- KI -->
      <div class="sel-side ai-side" id="side-ai">
        <div class="side-tag ai-tag">GEGNER</div>
        <div class="roster" id="roster-ai"></div>
        <div class="weapon-row" id="weapons-ai"></div>
      </div>
    </div>
  </section>

  <!-- ============ KAMPF ============ -->
  <section id="screen-fight" class="screen">
    <div id="hud">
      <div class="hud-side hud-left">
        <div class="hud-portrait" id="portrait-p"></div>
        <div class="hud-info">
          <div class="hud-name" id="hud-name-p">—</div>
          <div class="weapon-badge" id="hud-weapon-p">FISTS</div>
          <div class="bar-wrap"><div class="bar-fill health-bar" id="bar-hp-p"></div></div>
          <div class="bar-wrap stam-wrap"><div class="bar-fill stam-bar" id="bar-st-p"></div></div>
          <div class="bleed-indicator" id="bleed-p"></div>
        </div>
      </div>

      <div class="hud-center">
        <div class="round-lbl">RUNDE <span id="hud-round">1</span></div>
        <div class="clock" id="hud-clock">3:00</div>
        <div class="round-dots" id="round-dots"></div>
      </div>

      <div class="hud-side hud-right">
        <div class="hud-info right-info">
          <div class="hud-name" id="hud-name-a">—</div>
          <div class="weapon-badge" id="hud-weapon-a">FISTS</div>
          <div class="bar-wrap"><div class="bar-fill health-bar" id="bar-hp-a"></div></div>
          <div class="bar-wrap stam-wrap"><div class="bar-fill stam-bar" id="bar-st-a"></div></div>
          <div class="bleed-indicator" id="bleed-a"></div>
        </div>
        <div class="hud-portrait" id="portrait-a"></div>
      </div>
    </div>

    <canvas id="game-canvas"></canvas>

    <div id="tech-label"></div>
    <div id="big-banner"></div>
    <div id="combo-display"></div>

    <div id="hint-bar">
      A/D Bewegen · S Ducken/Block · J Schnell · K Schwer · L Kick · Shift+L Spezial · U Weit · I Oben · O Entwaffnen · N Aufheben
    </div>
  </section>

  <!-- ============ RUNDEN-PAUSE ============ -->
  <section id="screen-round" class="screen">
    <div class="round-card">
      <div class="rc-title">ENDE RUNDE <span id="rc-num">1</span></div>
      <div id="rc-scores"></div>
      <div id="rc-advice"></div>
      <div id="rc-countdown">Nächste Runde in 5...</div>
    </div>
  </section>

  <!-- ============ ERGEBNIS ============ -->
  <section id="screen-result" class="screen">
    <div class="result-card">
      <div class="result-method" id="res-method">K.O.</div>
      <div class="result-winner" id="res-winner">SIEGER</div>
      <div class="result-detail" id="res-detail"></div>
      <div class="result-reel" id="res-reel"></div>
      <button id="btn-rematch" class="btn-red">NOCHMAL</button>
      <button id="btn-menu" class="btn-ghost">MENÜ</button>
    </div>
  </section>

</div>
<script src="game.js"></script>
</body>
</html>
